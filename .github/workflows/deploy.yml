
name: Deploy React Projects to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build all React projects
        run: |
          mkdir -p public

          for package_json in */package.json; do
            [ -e "$package_json" ] || continue

            project="${package_json%/package.json}"

            echo "Building project: $project"

            (
              cd "$project"
              npm ci
              npm run build -- --base="/react-practice/$project/" --outDir="$GITHUB_WORKSPACE/public/$project"
            )
          done

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
